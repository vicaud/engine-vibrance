name: Build Executable

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository with submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Vulkan SDK
        uses: humbletim/install-vulkan-sdk@v1.2
        with:
          version: 1.4.341.1
          cache: true

      - name: Download libraries
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path C:/dev | Out-Null
          Set-Location C:/dev
          git clone --depth 1 --branch v1.4.341 https://github.com/KhronosGroup/Vulkan-Headers.git Vulkan-Headers
          if ($LASTEXITCODE -ne 0) { git clone --depth 1 https://github.com/KhronosGroup/Vulkan-Headers.git Vulkan-Headers }
          git clone --depth 1 https://github.com/g-truc/glm.git glm
          git clone --depth 1 --branch v3.16.0 https://github.com/skypjack/entt.git entt
          git clone --depth 1 --branch v3.3.0 https://github.com/GPUOpen-LibrariesAndSDKs/VulkanMemoryAllocator.git VulkanMemoryAllocator-3.3.0
          git clone --depth 1 --branch v0.9.0 https://github.com/spnda/fastgltf.git fastgltf-0.9.0
          git clone --depth 1 --branch VER-2-14-3 https://github.com/freetype/freetype.git freetype-VER-2-14-3
          git clone --depth 1 --branch 3.4 https://github.com/glfw/glfw.git glfw-3.4
          git clone --depth 1 https://github.com/nothings/stb.git stb
          git clone --depth 1 https://github.com/memononen/nanosvg.git nanosvg
          git clone --depth 1 --branch v4.6.1 https://github.com/simdjson/simdjson.git simdjson
          New-Item -ItemType Directory -Force -Path C:/dev/simdjson/singleheader | Out-Null
          Invoke-WebRequest https://github.com/simdjson/simdjson/releases/download/v4.6.1/simdjson.h -OutFile C:/dev/simdjson/singleheader/simdjson.h
          Invoke-WebRequest https://github.com/simdjson/simdjson/releases/download/v4.6.1/simdjson.cpp -OutFile C:/dev/simdjson/singleheader/simdjson.cpp
          New-Item -ItemType Directory -Force -Path C:/dev/vmainc/vma | Out-Null
          Copy-Item C:/dev/VulkanMemoryAllocator-3.3.0/include/vk_mem_alloc.h C:/dev/vmainc/vma/vk_mem_alloc.h
          exit 0

      - name: Build FreeType and GLFW (static)
        shell: pwsh
        run: |
          $env:PATH = "C:\mingw64\bin;" + $env:PATH
          cmake -S C:/dev/freetype-VER-2-14-3 -B C:/dev/freetype-build -G "MinGW Makefiles" "-DCMAKE_BUILD_TYPE=Release" "-DBUILD_SHARED_LIBS=OFF" "-DFT_DISABLE_ZLIB=ON" "-DFT_DISABLE_BZIP2=ON" "-DFT_DISABLE_PNG=ON" "-DFT_DISABLE_HARFBUZZ=ON" "-DFT_DISABLE_BROTLI=ON"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmake --build C:/dev/freetype-build --parallel 4
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmake -S C:/dev/glfw-3.4 -B C:/dev/glfw-build -G "MinGW Makefiles" "-DCMAKE_BUILD_TYPE=Release" "-DBUILD_SHARED_LIBS=OFF" "-DGLFW_BUILD_EXAMPLES=OFF" "-DGLFW_BUILD_TESTS=OFF" "-DGLFW_BUILD_DOCS=OFF"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmake --build C:/dev/glfw-build --parallel 4
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build simdjson and fastgltf (static)
        shell: pwsh
        run: |
          $env:PATH = "C:\mingw64\bin;" + $env:PATH
          New-Item -ItemType Directory -Force -Path C:/dev/extra-build | Out-Null
          Set-Location C:/dev/extra-build
          $srcs = @("C:/dev/simdjson/singleheader/simdjson.cpp")
          $srcs += Get-ChildItem C:/dev/fastgltf-0.9.0/src -Filter *.cpp | ForEach-Object { $_.FullName -replace '\\','/' }
          foreach ($s in $srcs) {
            $o = [IO.Path]::GetFileNameWithoutExtension($s) + ".o"
            Write-Host "Compiling $s"
            g++ -std=c++20 -O2 -c $s -o $o -IC:/dev/simdjson/singleheader -IC:/dev/fastgltf-0.9.0/include
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          $objs = (Get-ChildItem -Filter *.o).Name
          ar rcs libextra.a $objs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Get-ChildItem C:/dev/extra-build | Select-Object -ExpandProperty Name

      - name: Write .env.cmake
        shell: pwsh
        run: |
          $vk = $env:VULKAN_SDK -replace '\\','/'
          @"
          set(MINGW_PATH "C:/mingw64")
          set(VULKAN_SDK_PATH "$vk")
          set(GLFW_PATH "C:/dev/glfw-3.4")
          set(GLM_PATH "C:/dev/glm")
          set(VMA_PATH "C:/dev/VulkanMemoryAllocator-3.3.0")
          set(GLTF_PATH "C:/dev/fastgltf-0.9.0")
          set(SIMDJSON_PATH "C:/dev/simdjson/singleheader")
          set(ENTT_PATH "C:/dev/entt")
          set(FREETYPE_PATH "C:/dev/freetype-VER-2-14-3")
          set(STB_PATH "C:/dev/stb")
          set(NANOSVG_PATH "C:/dev/nanosvg")
          "@ | Set-Content -Path .env.cmake

      - name: Configure CMake (MinGW)
        shell: pwsh
        run: |
          $env:PATH = "C:\mingw64\bin;" + $env:PATH
          $env:CXXFLAGS = "-IC:/dev/simdjson/singleheader -IC:/dev/vmainc -IC:/dev/glm -IC:/dev/entt/src -IC:/dev/stb -IC:/dev/nanosvg/src -IC:/dev/fastgltf-0.9.0/include -IC:/dev/freetype-VER-2-14-3/include -IC:/dev/glfw-3.4/include -IC:/dev/Vulkan-Headers/include"
          $sdk = $env:VULKAN_SDK
          $vkLib = $null
          if (Test-Path "$sdk/Lib/vulkan-1.lib") { $vkLib = "$sdk/Lib/vulkan-1.lib" }
          if (-not $vkLib) {
            $found = Get-ChildItem -Path $sdk -Recurse -Include "vulkan-1.lib","vulkan-1.dll","libvulkan-1.dll.a" -ErrorAction SilentlyContinue | Select-Object -First 1
            if ($found) { $vkLib = $found.FullName }
          }
          if (-not $vkLib -and (Test-Path "C:/Windows/System32/vulkan-1.dll")) { $vkLib = "C:/Windows/System32/vulkan-1.dll" }
          if (-not $vkLib) { Write-Host "ERREUR: aucune bibliotheque Vulkan trouvee"; exit 1 }
          $vkLib = $vkLib -replace '\\','/'
          Write-Host "Vulkan library used: $vkLib"
          $ft = (Get-ChildItem C:/dev/freetype-build -Filter "libfreetype*.a" -Recurse | Select-Object -First 1).FullName -replace '\\','/'
          $gl = (Get-ChildItem C:/dev/glfw-build -Filter "libglfw3.a" -Recurse | Select-Object -First 1).FullName -replace '\\','/'
          $ex = "C:/dev/extra-build/libextra.a"
          Write-Host "FreeType lib: $ft"
          Write-Host "GLFW lib: $gl"
          Write-Host "simdjson+fastgltf lib: $ex"
          $stdlibs = "$ex $ft $gl -lgdi32 -lshell32 -lkernel32 -luser32 -lwinspool -lole32 -loleaut32 -luuid -lcomdlg32 -ladvapi32"
          cmake -S . -B build/windows-x64/Release -G "MinGW Makefiles" "-DCMAKE_BUILD_TYPE=Release" "-DVIBRANCE_WINDOWS_ARCHITECTURE=x64" "-DVulkan_INCLUDE_DIR=C:/dev/Vulkan-Headers/include" "-DVulkan_LIBRARY=$vkLib" "-DCMAKE_CXX_STANDARD_LIBRARIES=$stdlibs"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build
        shell: pwsh
        run: |
          $env:PATH = "C:\mingw64\bin;" + $env:PATH
          cmake --build build/windows-x64/Release --config Release --parallel 4
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: vibranceUI-executable
          path: build/windows-x64/Release/
