name: Build Executable

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository with submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Vulkan SDK
        uses: humbletim/install-vulkan-sdk@v1.2
        with:
          version: 1.4.341.1
          cache: true

      - name: Download libraries
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path C:/dev | Out-Null
          Set-Location C:/dev
          git clone --depth 1 --branch v1.4.341 https://github.com/KhronosGroup/Vulkan-Headers.git Vulkan-Headers
          if ($LASTEXITCODE -ne 0) { git clone --depth 1 https://github.com/KhronosGroup/Vulkan-Headers.git Vulkan-Headers }
          git clone --depth 1 https://github.com/g-truc/glm.git glm
          git clone --depth 1 --branch v3.16.0 https://github.com/skypjack/entt.git entt
          git clone --depth 1 --branch v3.3.0 https://github.com/GPUOpen-LibrariesAndSDKs/VulkanMemoryAllocator.git VulkanMemoryAllocator-3.3.0
          git clone --depth 1 --branch v0.9.0 https://github.com/spnda/fastgltf.git fastgltf-0.9.0
          git clone --depth 1 --branch VER-2-14-3 https://github.com/freetype/freetype.git freetype-VER-2-14-3
          git clone --depth 1 --branch 3.4 https://github.com/glfw/glfw.git glfw-3.4
          git clone --depth 1 https://github.com/nothings/stb.git stb
          git clone --depth 1 https://github.com/memononen/nanosvg.git nanosvg
          git clone --depth 1 --branch v4.6.1 https://github.com/simdjson/simdjson.git simdjson
          New-Item -ItemType Directory -Force -Path C:/dev/simdjson/singleheader | Out-Null
          Invoke-WebRequest https://github.com/simdjson/simdjson/releases/download/v4.6.1/simdjson.h -OutFile C:/dev/simdjson/singleheader/simdjson.h
          Invoke-WebRequest https://github.com/simdjson/simdjson/releases/download/v4.6.1/simdjson.cpp -OutFile C:/dev/simdjson/singleheader/simdjson.cpp
          New-Item -ItemType Directory -Force -Path C:/dev/vmainc/vma | Out-Null
          Copy-Item C:/dev/VulkanMemoryAllocator-3.3.0/include/vk_mem_alloc.h C:/dev/vmainc/vma/vk_mem_alloc.h
          exit 0

      - name: Write .env.cmake
        shell: pwsh
        run: |
          $vk = $env:VULKAN_SDK -replace '\\','/'
          @"
          set(MINGW_PATH "C:/mingw64")
          set(VULKAN_SDK_PATH "$vk")
          set(GLFW_PATH "C:/dev/glfw-3.4")
          set(GLM_PATH "C:/dev/glm")
          set(VMA_PATH "C:/dev/VulkanMemoryAllocator-3.3.0")
          set(GLTF_PATH "C:/dev/fastgltf-0.9.0")
          set(SIMDJSON_PATH "C:/dev/simdjson/singleheader")
          set(ENTT_PATH "C:/dev/entt")
          set(FREETYPE_PATH "C:/dev/freetype-VER-2-14-3")
          set(STB_PATH "C:/dev/stb")
          set(NANOSVG_PATH "C:/dev/nanosvg")
          "@ | Set-Content -Path .env.cmake

      - name: Configure CMake (MinGW)
        shell: pwsh
        run: |
          $env:PATH = "C:\mingw64\bin;" + $env:PATH
          $env:CXXFLAGS = "-IC:/dev/simdjson/singleheader -IC:/dev/vmainc -IC:/dev/glm -IC:/dev/entt/src -IC:/dev/stb -IC:/dev/nanosvg/src -IC:/dev/fastgltf-0.9.0/include -IC:/dev/freetype-VER-2-14-3/include -IC:/dev/glfw-3.4/include -IC:/dev/Vulkan-Headers/include"
          $vkLib = ($env:VULKAN_SDK -replace '\\','/') + "/Lib/vulkan-1.lib"
          Write-Host "VULKAN_SDK = $env:VULKAN_SDK"
          Write-Host "vkLib = $vkLib  exists: $(Test-Path $vkLib)"
          Write-Host "Vulkan headers exist: $(Test-Path C:/dev/Vulkan-Headers/include/vulkan/vulkan.h)"
          cmake -S . -B build/windows-x64/Release -G "MinGW Makefiles" "-DCMAKE_BUILD_TYPE=Release" "-DVIBRANCE_WINDOWS_ARCHITECTURE=x64" "-DVulkan_INCLUDE_DIR=C:/dev/Vulkan-Headers/include" "-DVulkan_LIBRARY=$vkLib"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build
        shell: pwsh
        run: |
          $env:PATH = "C:\mingw64\bin;" + $env:PATH
          cmake --build build/windows-x64/Release --config Release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: vibranceUI-executable
          path: build/windows-x64/Release/
